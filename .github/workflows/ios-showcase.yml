name: Capture flutter-blog on iPhone
on:
  push:
    branches: [arena/d3e4a8ec-braineno-github-io]
    paths: ['.github/workflows/ios-showcase.yml']
jobs:
  capture:
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BrainEno/flutter-blog
          ref: de15e346f621c2f3506d9184fde3ae48c1689b80
          path: client
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Boot a phone and build the simulator app
        working-directory: client
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for ds in reversed(list(json.load(sys.stdin)['devices'].values())) for d in ds if d['name'].startswith('iPhone')))" )
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          flutter build ios --simulator --debug --no-codesign --dart-define=API_BASE_URL=http://127.0.0.1:4000
      - name: Record the feed, tap an article, and scroll its text
        run: |
          mkdir "$RUNNER_TEMP/axe"
          curl -fsSL 'https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz' | tar xz -C "$RUNNER_TEMP/axe"
          AXE=$(find "$RUNNER_TEMP/axe" -type f -iname axe | head -1)
          test -x "$AXE"
          python3 scripts/showcase/demo-feed.py > "$RUNNER_TEMP/api.log" 2>&1 &
          server=$!; trap 'kill "$server" || true' EXIT
          mkdir capture
          sim() { xcrun simctl "$@"; }
          sim bootstatus "$UDID" -b
          sim status_bar "$UDID" override --time 9:41
          sim install "$UDID" client/build/ios/iphonesimulator/Runner.app
          sim launch "$UDID" com.nodeman24.nowave -AppleLanguages '(en)' -AppleLocale en_US
          sleep 12
          sim io "$UDID" screenshot capture/feed.png
          # Start simctl directly. Signalling a background shell function only
          # interrupts its wrapper, not the recorder that must flush the MP4.
          set -m
          xcrun simctl io "$UDID" recordVideo --codec=h264 capture/walkthrough.mp4 &
          rec=$!
          sleep 4
          "$AXE" tap --udid "$UDID" -x 160 -y 545
          sleep 4
          sim io "$UDID" screenshot capture/reader.png
          "$AXE" swipe --udid "$UDID" --start-x 170 --start-y 620 --end-x 170 --end-y 275
          sleep 4
          sim io "$UDID" screenshot capture/margin.png
          kill -INT -- "-$rec"
          for _ in {1..20}; do kill -0 "$rec" 2>/dev/null || break; sleep 1; done
          if kill -0 "$rec" 2>/dev/null; then kill -TERM -- "-$rec"; exit 1; fi
          wait "$rec" || true
          cat "$RUNNER_TEMP/api.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-recording
          path: capture/
          retention-days: 3
  compress:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-recording
          path: capture
      - name: Save only compressed media to this branch
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          dest=public/images/works/flutter-blog-ios
          mkdir -p "$dest" public/videos
          for scene in feed reader margin; do
            ffmpeg -y -loglevel error -i "capture/$scene.png" -vf scale=720:-2 -c:v libwebp -quality 82 "$dest/$scene.webp"
          done
          clip=public/videos/flutter-blog-ios.mp4
          ffmpeg -y -loglevel error -i capture/walkthrough.mp4 -vf 'fps=20,scale=512:-2' -c:v libx264 -crf 24 -an -pix_fmt yuv420p -movflags +faststart "$clip"
          test $(stat -c%s "$clip") -lt 2097152
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest" "$clip"
          git commit -m 'Import compressed iPhone simulator captures'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
