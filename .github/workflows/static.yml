name: Static site → GitHub Pages

# Two jobs, one rule: nothing gets published that has not been served and
# crawled locally first.
#
#  verify — every push and every PR: typecheck, lint, dev-server probe, then the
#           export is built **twice** and smoke-tested both ways:
#             · at the domain root (BrainEno.github.io user site / custom domain)
#             · mounted at a sub-path (Pages project site, where a missing
#               base-path prefix 404s images or OG cards while JS still loads)
#  build/deploy — pushes to main (or manual workflow_dispatch), automatically
#           detecting whether the repository is the user site
#           (`<owner>.github.io` → root `/`) or a project site (`/<repo>/`).
#
# Nothing here talks to a database: the build reads `content/defaults.ts` or the
# committed `content/published.json` snapshot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Pages target (user root vs project sub-path)
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner_lc=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          if [ -n "$CUSTOM_SITE_URL" ]; then
            base_path=""
            site_url="${CUSTOM_SITE_URL%/}"
          elif [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            base_path=""
            site_url="https://${REPO_OWNER}.github.io"
          else
            base_path="/${REPO_NAME}"
            site_url="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "Resolved target: site_url=${site_url} base_path='${base_path}'"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check TV alpha geometry
        run: npm run test:tv-assets
      # `next dev --webpack` is the daily command and it exercises a webpack
      # loader path the production builds never touch — a config that builds
      # fine can still 500 in dev (see the `pageExtensions` note in
      # next.config.ts). Boot it, require a 200, then shut it down.
      - name: Dev server serves the app (webpack)
        run: |
          npm run dev -- --port 3100 > /tmp/dev.log 2>&1 &
          base="${NEXT_PUBLIC_BASE_PATH%/}"
          url="http://127.0.0.1:3100${base}/"
          status=000
          for _ in $(seq 1 120); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          pkill -f '[n]ext dev' || true
          pkill -f '[n]ext-server' || true
          if [ "$status" != "200" ]; then
            echo "dev server returned $status for $url"
            tail -40 /tmp/dev.log
            exit 1
          fi
          echo "dev server ok ($url)"
      - name: Build (user site / domain root)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://BrainEno.github.io
        run: npm run build:static
      - name: Smoke-test (user site / domain root)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://BrainEno.github.io
        run: npm run smoke
      - name: Build (project site sub-path)
        env:
          NEXT_PUBLIC_BASE_PATH: /subpath-check
          NEXT_PUBLIC_SITE_URL: https://BrainEno.github.io/subpath-check
        run: npm run build:static
      - name: Smoke-test (project site sub-path)
        env:
          NEXT_PUBLIC_BASE_PATH: /subpath-check
          NEXT_PUBLIC_SITE_URL: https://BrainEno.github.io/subpath-check
        run: npm run smoke

  build:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Pages target (user root vs project sub-path)
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          owner_lc=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          repo_lc=$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          if [ -n "$CUSTOM_SITE_URL" ]; then
            base_path=""
            site_url="${CUSTOM_SITE_URL%/}"
          elif [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            base_path=""
            site_url="https://${REPO_OWNER}.github.io"
          else
            base_path="/${REPO_NAME}"
            site_url="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "Building Pages export for site_url=${site_url} base_path='${base_path}'"
      - run: npm ci
      - name: Build static export
        run: npm run build:static
      - name: Smoke-test production artifact
        run: npm run smoke
      # Pages needs a .nojekyll marker, or files/directories starting with an
      # underscore (`_next/`) are dropped from the published output.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
