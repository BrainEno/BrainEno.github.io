name: Capture flutter-blog on Android
on:
  workflow_dispatch:
  push:
    branches: [arena/d3e4a8ec-braineno-github-io]
    paths: ['.github/workflows/mobile-showcase.yml', 'scripts/showcase/**']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BrainEno/flutter-blog
          ref: de15e346f621c2f3506d9184fde3ae48c1689b80
          path: client
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - working-directory: client
        run: flutter build apk --debug --target-platform android-x64 --dart-define=API_BASE_URL=http://10.0.2.2:4000
      - name: Enable KVM for this runner
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          script: python3 scripts/showcase/demo-feed.py & bash scripts/showcase/capture-android.sh client/build/app/outputs/flutter-apk/app-debug.apk capture
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-blog-capture
          path: capture/
          retention-days: 3
