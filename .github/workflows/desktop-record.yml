name: Record the three native desktop workspaces
on:
  push:
    branches: [arena/d3e4a8ec-braineno-github-io]
    paths: ['.github/workflows/desktop-record.yml', 'scripts/capture-desktop/**']
permissions:
  contents: read
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: books, slug: win7-book-management, repo: win7-book-management, ref: 7bb049f4d5a9d6fcbe3655dc6fd4a835cc0e48ce, dir: app}
          - {kind: ktv, slug: lyric-forge-ktv, repo: lyric-forge-ktv, ref: 583023463cff3bcc8323287819245312c39ed841, dir: app}
          - {kind: scribe, slug: scribeforge, repo: ScribeForge, ref: 1a0c51d9ab9925b5093e6462ca9e4d6ba91241fc, dir: app/clients/flutter_desktop}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: BrainEno/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: app
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
        if: matrix.kind == 'books'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: matrix.kind != 'books'
        with: {flutter-version: '3.47.7', channel: stable, cache: true}
      - name: Compile and run actual desktop UI
        working-directory: ${{ matrix.dir }}
        run: |
          $env:PYTHONUTF8='1'
          $dest="$env:RUNNER_TEMP/frames"
          mkdir $dest
          $env:CAPTURE_OUT=$dest
          "CAPTURE_OUT=$dest" >> $env:GITHUB_ENV
          $kind='${{ matrix.kind }}'
          if ($kind -eq 'scribe') { flutter create --platforms=windows --project-name scribeforge_desktop .; if ($LASTEXITCODE) { exit 1 } }
          python "$env:GITHUB_WORKSPACE/scripts/capture-desktop/prepare.py" $kind
          if ($LASTEXITCODE) { exit 1 }
          if ($kind -eq 'books') {
            msbuild Win7BookManagement.sln -restore /m /p:Configuration=Release /p:Platform=x86
            if ($LASTEXITCODE) { exit 1 }
            $exe=(Resolve-Path tools/Win7BookManagement.UiTools/bin/x86/Release/Win7BookManagement.UiTools.exe).Path
            $p=Start-Process $exe -ArgumentList '--ui-snapshots',$dest -PassThru
          } else {
            flutter build windows --debug --target lib/capture_main.dart
            if ($LASTEXITCODE) { exit 1 }
            $exe=(Get-ChildItem build/windows/x64/runner/Debug/*.exe)[0].FullName
            $p=Start-Process $exe -PassThru
          }
          if (!$p.WaitForExit(120000)) {throw 'No completed recording'}
          if (!(Test-Path "$dest/0179.png")) {if (Test-Path "$dest/error.txt") {cat "$dest/error.txt"};throw 'Incomplete capture'}
      - name: Encode web files
        run: |
          pip install pillow imageio-ffmpeg
          python scripts/capture-desktop/encode.py ${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.slug }}
          path: media/
          retention-days: 3
  collect:
    if: always() && !cancelled()
    needs: record
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'media-*', merge-multiple: true, path: captures}
      - name: Save media only to the working branch
        run: |
          mkdir -p public/images/works public/videos
          cp captures/*.webp public/images/works/
          cp captures/*.mp4 public/videos/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/works/*.webp public/videos/*.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Import compressed native desktop recordings'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
